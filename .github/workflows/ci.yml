name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Check
        run: npm run check

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CODESTORY_SMOKE_OUT: artifacts/browser-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npx --no-install playwright-core install --with-deps chromium
      - run: npm run test:browser
      - name: Install video encoder
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Export and decode story videos
        run: node scripts/video-smoke.mjs
        env:
          CODESTORY_VIDEO_SMOKE_OUT: artifacts/video-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-smoke
          path: artifacts/browser-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-smoke
          path: artifacts/video-smoke

  zed-extension:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: Test and compile Zed extension
        run: npm run check:zed
